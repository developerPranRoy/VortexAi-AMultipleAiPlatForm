services:
  # ── Redis ─────────────────────────────────────────────────────────
  - type: redis
    name: vortexai-redis
    plan: free
    maxmemoryPolicy: noeviction

  # ── Auth Service ──────────────────────────────────────────────────
  - type: web
    name: vortexai-auth
    runtime: node
    buildCommand: cd backend/services/auth && npm install
    startCommand: cd backend/services/auth && node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: vortexai-redis
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false

  # ── Chat Service ──────────────────────────────────────────────────
  - type: web
    name: vortexai-chat
    runtime: node
    buildCommand: cd backend/services/chat && npm install
    startCommand: cd backend/services/chat && node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: vortexai-redis
          property: connectionString

  # ── Agent Service ─────────────────────────────────────────────────
  - type: web
    name: vortexai-agent
    runtime: node
    buildCommand: cd backend/services/agent && npm install
    startCommand: cd backend/services/agent && node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: vortexai-redis
          property: connectionString
      - key: CHAT_SERVICE
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  # ── Gateway ───────────────────────────────────────────────────────
  - type: web
    name: vortexai-gateway
    runtime: node
    buildCommand: cd backend/gateway && npm install
    startCommand: cd backend/gateway && node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: AUTH_SERVICE_URL
        sync: false
      - key: CHAT_SERVICE_URL
        sync: false
      - key: AGENT_SERVICE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: vortexai-redis
          property: connectionString

  # ── Frontend ──────────────────────────────────────────────────────
  - type: web
    name: vortexai-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npx serve -s dist -l 10000
    envVars:
      - key: VITE_API_URL
        sync: false
